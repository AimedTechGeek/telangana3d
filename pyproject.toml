[project]
name = "telangana3d"
version = "0.1.0"
description = "Telangana 3D terrain map and terrain block rendered with forge3d"
requires-python = ">=3.12"
dependencies = [
    "forge3d>=1.44.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]
